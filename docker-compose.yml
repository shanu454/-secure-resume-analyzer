services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-resume_analyzer}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume} -d ${POSTGRES_DB:-resume_analyzer}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: prod
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (32+ random characters)}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-resume_analyzer}
      UPLOAD_DIR: /srv/uploads
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - uploads:/srv/uploads
    # Not published to the host: the frontend container proxies /api to it.
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads:
