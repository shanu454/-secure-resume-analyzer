name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: resume_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # The whole suite runs against real PostgreSQL, not just SQLite.
      TEST_DATABASE_URL: postgresql+psycopg2://resume:ci-password@localhost:5432/resume_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Extraction evaluation
        run: python -m evaluation.evaluate
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
        env:
          SECRET_KEY: ci-only-secret-ci-only-secret-ci-only
          POSTGRES_PASSWORD: ci-only
